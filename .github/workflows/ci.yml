name: CI

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build src\BrowserWrangler -c Release -p:Platform=${{ matrix.platform }}

      - name: Publish AOT
        run: >
          dotnet publish src\BrowserWrangler -c Release
          -r win-${{ matrix.platform == 'ARM64' && 'arm64' || 'x64' }}
          -p:Platform=${{ matrix.platform }}
          -p:PublishAot=true
          --self-contained
          -o publish\${{ matrix.platform }}

      - name: Test
        if: matrix.platform == 'x64'
        run: dotnet test tests\BrowserWrangler.Core.Tests -c Release
