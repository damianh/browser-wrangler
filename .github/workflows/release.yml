name: Release

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to publish
        required: true
        default: stable
        type: choice
        options:
          - stable
          - dev

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      tag: ${{ steps.v.outputs.tag }}
      artifact_prefix: ${{ steps.v.outputs.artifact_prefix }}
      release_title: ${{ steps.v.outputs.release_title }}
    steps:
      # Versioning strategy: YYYY.MDD.buildrun (e.g. 2026.718.42) — month unpadded
      # so the tag matches the numerically-normalized ProductVersion.
      - id: v
        shell: bash
        run: |
          VERSION="$(date -u +%Y.%-m%d).${GITHUB_RUN_NUMBER}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            CHANNEL="dev"
          else
            CHANNEL="${{ inputs.channel }}"
          fi

          if [[ "${CHANNEL}" == "dev" ]]; then
            PRERELEASE="true"
            TAG="v${VERSION}-dev"
            ARTIFACT_PREFIX="BrowserWrangler-dev"
            RELEASE_TITLE="Browser Wrangler (Dev Channel) ${VERSION}"
          else
            PRERELEASE="false"
            TAG="v${VERSION}"
            ARTIFACT_PREFIX="BrowserWrangler"
            RELEASE_TITLE="Browser Wrangler ${VERSION}"
          fi

          {
            echo "version=${VERSION}"
            echo "channel=${CHANNEL}"
            echo "prerelease=${PRERELEASE}"
            echo "tag=${TAG}"
            echo "artifact_prefix=${ARTIFACT_PREFIX}"
            echo "release_title=${RELEASE_TITLE}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      ARTIFACT_PREFIX: ${{ needs.version.outputs.artifact_prefix }}
      PLATFORM: ${{ matrix.arch == 'arm64' && 'ARM64' || 'x64' }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        if: matrix.arch == 'x64'
        run: dotnet test tests\BrowserWrangler.Core.Tests -c Release

      - name: Publish (self-contained, Native AOT)
        run: >
          dotnet publish src\BrowserWrangler -c Release
          -r win-${{ matrix.arch }}
          -p:Platform=${{ env.PLATFORM }}
          -p:PublishAot=true
          --self-contained
          -p:Version=${{ env.VERSION }}
          -p:ReleaseChannel=${{ env.CHANNEL }}
          -o publish\${{ matrix.arch }}

      - name: Zip (portable)
        run: Compress-Archive -Path publish\${{ matrix.arch }}\* -DestinationPath $env:ARTIFACT_PREFIX-$env:VERSION-$env:ARCH.zip

      - name: Build installer (Inno Setup, per-user)
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          /DAppVersion=${{ env.VERSION }}
          /DSourceDir=${{ github.workspace }}\publish\${{ matrix.arch }}
          /DArch=${{ matrix.arch }}
          /DChannel=${{ env.CHANNEL }}
          installer\BrowserWrangler.iss

      - uses: actions/upload-artifact@v6
        with:
          name: packages-${{ matrix.arch }}
          path: |
            ${{ env.ARTIFACT_PREFIX }}-*.zip
            installer\output\${{ env.ARTIFACT_PREFIX }}-*-setup.exe

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          RELEASE_TITLE: ${{ needs.version.outputs.release_title }}
          ARTIFACT_PREFIX: ${{ needs.version.outputs.artifact_prefix }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        shell: bash
        run: |
          find . -name "${ARTIFACT_PREFIX}-*" -exec mv {} . \; 2>/dev/null || true
          EXTRA_FLAGS=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            EXTRA_FLAGS+=(--prerelease)
          fi

          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_TITLE}" \
            --generate-notes \
            "${EXTRA_FLAGS[@]}" \
            ${ARTIFACT_PREFIX}-*.zip ${ARTIFACT_PREFIX}-*-setup.exe
